<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radhe Sweets - Shop Management Dashboard</title>
  <meta name="description" content="Official Radhe Sweets Confectionery Shop Management Suite. Streamlined Point of Sale (POS), real-time inventory, customer orders, and analytics." />
  <meta name="theme-color" content="#FAF7F2" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with forms and container queries plugins (1:1 with Stitch) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Tailwind Configuration matching Stitch 1:1 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FAF7F2',
              card: '#FFFFFF',
              border: '#F0ECE4',
              primary: '#C86D3B',
              primaryHover: '#B25D2E',
              dark: '#2A1F1D',
              muted: '#7C7267',
              accent: '#E07A5F',
              gold: '#DDA15E'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif']
          },
          boxShadow: {
            subtle: '0 2px 10px rgba(74, 58, 47, 0.04)',
            card: '0 4px 20px -2px rgba(92, 64, 43, 0.06)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FAF7F2] text-[#2A1F1D] min-h-screen antialiased selection:bg-[#C86D3B] selection:text-white">
  <div id="app"></div>

  <!-- Main TypeScript Runtime -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
